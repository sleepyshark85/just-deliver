name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The Category=Pulumi tests drive the real CLI against a local file backend (no cloud, no providers).
      - uses: pulumi/actions@v6
      - run: tools/verify.sh
