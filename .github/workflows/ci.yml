name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The Category=Pulumi tests drive the real CLI against a local file backend (no cloud); the container-app preview
      # test also downloads the azure-native provider plugin (placeholder credentials, no Azure calls).
      - uses: pulumi/actions@v6
      - run: tools/verify.sh
