kind: Mapping
match: { kind: runtime }
# Every workload runs as a Container App on Consumption in the environment's Container Apps environment, sized for the free
# tier (standards section 6). The image and first port come from the workload's definition. This is the runtime node (phase
# runtime): the infrastructure walk does not deploy it, the release flow does.
probe: { path: /health, expectedStatus: 200 }
nodes:
  runtime:
    template: azure/container-app
    config:
      resourceGroupName: ${env.resourceGroup}
      location: ${env.region}
      containerAppsEnvironmentId: ${env.containerAppsEnvironment.id}
      containerAppName: ${name('ca')}
      image: ${workload.image}
      targetPort: ${workload.port}
      externalIngress: true
      cpu: 0.25
      memory: 0.5Gi
      minReplicas: 0
      maxReplicas: 1
      # Placeholders until the release flow (S16b) owns them: the engine will set the suffix, derived from the node's config, and the
      # traffic. A fixed suffix is valid for one deploy only, since Azure rejects a second revision with the same suffix.
      revisionSuffix: initial
      traffic:
        - { latestRevision: true, weight: 100 }
      maxInactiveRevisions: 5                     # free tier hygiene: inactive revisions are kept to a few
      variables:                                  # the workload's variables, deployed as a list of {name, value} sorted by name
        fn::entries: workload.variables
