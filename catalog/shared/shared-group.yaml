kind: SharedResource
name: shared-group
description: The shared layer's resource group, holding every shared-scope resource.
scope: shared
# Deployed by the shared layer's `jd env up` when what it offers reaches it through uses (docs/architecture/components.md section 3).
nodes:
  group:
    template: azure/resource-group
    config:
      resourceGroupName: ${name('rg')}
      location: ${env.region}
      tags: { project: just-deliver-mvp, tier: substrate }
exports:
  name: ${group.resourceGroupName}
  location: ${group.location}
