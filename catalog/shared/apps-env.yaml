kind: SharedResource
name: apps-env
description: The environment's Container Apps environment, which the runtime deploys every workload into; it logs to the shared workspace.
scope: environment
uses: [env-group, log-analytics]
nodes:
  apps:
    template: azure/container-apps-environment
    config:
      resourceGroupName: ${env-group.name}
      location: ${env-group.location}
      environmentName: ${name('cae')}
      workspaceResourceGroupName: ${log-analytics.resourceGroup}
      workspaceName: ${log-analytics.name}
      workspaceCustomerId: ${log-analytics.customerId}
exports:
  id: ${apps.environmentId}
  defaultDomain: ${apps.defaultDomain}
