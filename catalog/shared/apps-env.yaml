kind: SharedResource
name: apps-env
description: The environment's Container Apps environment, which the runtime deploys every workload into; its logs go to the shared workspace through a diagnostic setting.
scope: environment
uses: [env-group, log-analytics]
nodes:
  apps:
    template: azure/container-apps-environment
    config:
      resourceGroupName: ${env-group.name}
      location: ${env-group.location}
      environmentName: ${name('cae')}
  logs:
    template: azure/diagnostic-setting
    config:
      resourceId: ${apps.environmentId}
      workspaceResourceId: ${log-analytics.id}         # the workspace's resource id: Azure RBAC, no workspace key
      settingName: to-shared-workspace                 # unique per environment, the setting's parent
      categoryGroup: allLogs                           # every log category of the environment: console and system logs
exports:
  id: ${apps.environmentId}
  defaultDomain: ${apps.defaultDomain}
