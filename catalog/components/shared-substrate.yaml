kind: Component
name: shared-substrate
description: The once-per-subscription layer every environment builds on - a Log Analytics workspace and the one free-tier Cosmos DB account.
exports: [resourceGroupName, workspaceId, workspaceName, workspaceCustomerId, cosmosAccountId, cosmosAccountName, cosmosEndpoint]
# Transitional (docs/architecture/components.md section 7, S21b): required by the environment definitions until S21e collects shared
# resources and environment parts from what an environment offers.
implementations:
  default:
    classes:
      standard:
        # Free-tier budget (docs/engineering/standards.md section 6): Azure allows one free-tier Cosmos account per subscription, so it lives here once.
        nodes:
          group:
            template: azure/resource-group
            config:
              resourceGroupName: ${name('rg')}
              location: ${env.region}
              tags: { project: just-deliver-mvp, tier: substrate }
          workspace:
            template: azure/log-analytics
            config:
              resourceGroupName: ${group.resourceGroupName}
              location: ${group.location}
              workspaceName: ${name('law')}
              dailyQuotaGb: 0.15
          cosmos:
            template: azure/cosmos-account
            config:
              resourceGroupName: ${group.resourceGroupName}
              location: ${group.location}
              accountName: ${name('cosmos')}
              enableFreeTier: true
              totalThroughputLimit: 1000                  # Azure itself refuses anything beyond the free RU/s
              disableLocalAuth: true                      # no account key works: workloads reach the data through their identity only (ADR 0012)
        exports:
          resourceGroupName: ${group.resourceGroupName}
          workspaceId: ${workspace.workspaceId}
          workspaceName: ${workspace.workspaceName}
          workspaceCustomerId: ${workspace.workspaceCustomerId}
          cosmosAccountId: ${cosmos.accountId}
          cosmosAccountName: ${cosmos.accountName}
          cosmosEndpoint: ${cosmos.documentEndpoint}
