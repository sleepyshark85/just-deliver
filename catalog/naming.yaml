kind: Naming
rules:
  # Placeholders: {workload}, {id}, {env}, {hash}.
  # Containers of all workloads share one database, so the name carries the workload; the hash keeps
  # "shop-orders"+"store" apart from "shop"+"orders-store" (a clash would let one grant reach another's container).
  cosmos-container:
    pattern: "{workload}-{id}-{hash}"
    maxLength: 255
    allowed: "[a-z0-9-]"
  appi:
    pattern: "appi-{workload}-{env}-{hash}"
    maxLength: 260
    allowed: "[a-z0-9-]"
  # The workload's Container App, unique within the environment's resource group; at most 32 characters.
  ca:
    pattern: "ca-{workload}-{hash}"
    maxLength: 32
    allowed: "[a-z0-9-]"
  # Substrate: the environment name is in every name; the hash keeps globally unique ones (Cosmos accounts) apart from other deployments.
  rg:
    pattern: "rg-{env}-{hash}"
    maxLength: 90
    allowed: "[a-z0-9-]"
  law:
    pattern: "law-{env}-{hash}"
    maxLength: 63
    allowed: "[a-z0-9-]"
  cosmos:
    pattern: "cosmos-{env}-{hash}"
    maxLength: 44
    allowed: "[a-z0-9-]"
  cae:
    pattern: "cae-{env}-{hash}"
    maxLength: 32
    allowed: "[a-z0-9-]"
  db:
    pattern: "db-{env}"
    maxLength: 255
    allowed: "[a-z0-9-]"
