kind: Naming
rules:
  # Placeholders: {workload}, {id}, {env}, {hash}.
  # Containers of all workloads share one database, so the name carries the workload.
  cosmos-container:
    pattern: "{workload}-{id}"
    maxLength: 255
    allowed: "[a-z0-9-]"
  appi:
    pattern: "appi-{workload}-{env}-{hash}"
    maxLength: 260
    allowed: "[a-z0-9-]"
