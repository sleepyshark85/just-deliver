name: cosmos-sql-database
runtime: yaml
description: Provisions a Cosmos DB SQL database with throughput shared by its containers

configuration:
  # Resource group of the account
  resourceGroupName:
    type: String
  # Name of the Cosmos DB account
  accountName:
    type: String
  # Name of the database
  databaseName:
    type: String
  # Shared throughput of the database in RU/s
  throughput:
    type: Integer

resources:
  database:
    type: azure-native:cosmosdb:SqlResourceSqlDatabase
    properties:
      resourceGroupName: ${resourceGroupName}
      accountName: ${accountName}
      databaseName: ${databaseName}
      resource:
        id: ${databaseName}
      options:
        throughput: ${throughput}

outputs:
  databaseId: ${database.id}
  databaseName: ${database.name}
