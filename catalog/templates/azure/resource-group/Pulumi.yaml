name: resource-group
runtime: yaml
description: Provisions an Azure resource group

configuration:
  # Name of the resource group
  resourceGroupName:
    type: String
  # Azure region of the resource group
  location:
    type: String
  # Tags applied to the resource group
  tags:
    type: Map<String>

resources:
  resourceGroup:
    type: azure-native:resources:ResourceGroup
    properties:
      resourceGroupName: ${resourceGroupName}
      location: ${location}
      tags: ${tags}

outputs:
  resourceGroupName: ${resourceGroup.name}
  resourceGroupId: ${resourceGroup.id}
  location: ${resourceGroup.location}
