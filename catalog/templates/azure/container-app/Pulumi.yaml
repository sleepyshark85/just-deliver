name: container-app
runtime: yaml
description: Provisions a Container App in a Container Apps environment, with a system-assigned identity, multiple active revisions and traffic set by the caller

configuration:
  # Resource group of the container app
  resourceGroupName:
    type: String
  # Azure region of the container app (that of the environment)
  location:
    type: String
  # Resource ID of the Container Apps environment (output environmentId of container-apps-environment)
  containerAppsEnvironmentId:
    type: String
  # Name of the container app; also the name of its container
  containerAppName:
    type: String
  # Container image, public or by digest
  image:
    type: String
  # Port the container listens on; ingress forwards to it
  targetPort:
    type: Integer
  # Whether ingress is reachable from the internet (true) or only inside the environment (false)
  externalIngress:
    type: Boolean
  # vCPU of the container
  cpu:
    type: Number
  # Memory of the container, for example 0.5Gi
  memory:
    type: String
  # Fewest replicas; 0 lets the app scale to zero
  minReplicas:
    type: Integer
  # Most replicas
  maxReplicas:
    type: Integer
  # Environment variables of the container: a list of {name, value} items, the shape of the container's env
  # (Pulumi YAML cannot turn a name-to-value map into it, so the engine builds the list)
  variables:
    type: List<Map<String>>
  # Name suffix of the revision this deploy creates; the revision is named <containerAppName>--<revisionSuffix>, so its name is
  # known before it exists. Azure: lowercase letters, digits and '-', starts with a letter, ends with a letter or digit, no '--', and
  # the whole revision name at most 54 characters. A suffix that already names a revision of the app is an error, so a new
  # revision needs a new suffix.
  revisionSuffix:
    type: String
  # Where ingress sends traffic: a list of {revisionName, weight} or {latestRevision: true, weight} items, weights summing to 100.
  # Items mix text, boolean and integer values, which no Pulumi YAML item type expresses, so the type is Object; the provider checks
  # the types (weight an integer, latestRevision a boolean). The engine builds the list: Pulumi YAML has no conditional or loop to
  # choose between the latest and a named revision.
  traffic:
    type: List<Object>
  # Most inactive revisions Azure keeps; older ones are deleted
  maxInactiveRevisions:
    type: Integer

resources:
  containerApp:
    type: azure-native:app:ContainerApp
    properties:
      resourceGroupName: ${resourceGroupName}
      location: ${location}
      containerAppName: ${containerAppName}
      managedEnvironmentId: ${containerAppsEnvironmentId}
      # Consumption: no workloadProfileName.
      identity:
        type: SystemAssigned
      configuration:
        activeRevisionsMode: Multiple
        maxInactiveRevisions: ${maxInactiveRevisions}
        ingress:
          external: ${externalIngress}
          targetPort: ${targetPort}
          traffic: ${traffic}
      template:
        revisionSuffix: ${revisionSuffix}
        containers:
          - name: ${containerAppName}
            image: ${image}
            resources:
              cpu: ${cpu}
              memory: ${memory}
            env: ${variables}
        scale:
          minReplicas: ${minReplicas}
          maxReplicas: ${maxReplicas}

outputs:
  # The traffic as configured by the last deploy; the release flow reads the live revision from it
  traffic: ${traffic}
  containerAppId: ${containerApp.id}
  principalId: ${containerApp.identity.principalId}
  latestRevisionName: ${containerApp.latestRevisionName}
  latestRevisionFqdn: ${containerApp.latestRevisionFqdn}
  fqdn: ${containerApp.configuration.ingress.fqdn}
