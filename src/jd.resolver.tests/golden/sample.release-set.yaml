kind: ReleaseSet
label: 1.0.0
createdAt: 2026-01-02T03:04:05Z
workloads:
- definitionSha256: e1282a86e7b7a8103b9bcd85013bdd99997a50c2de5c762422f025659f741d5f
  dependsOn:
  - just-deliver-sample-worker
  definition: |
    apiVersion: just-deliver/v1
    kind: Workload

    metadata:
      name: just-deliver-sample-app
      team: platform-team

    container:
      image: ghcr.io/sleepyshark85/just-deliver-sample-app@sha256:267b1385d6102da0d5693506e740d509a40b654e6daa2a99c1169938d182cab9
      variables:
        LOG_LEVEL: info
        # The enforce-monitoring policy requires the monitoring component; the
        # workload maps its connection string to the variable the SDK reads.
        APPLICATIONINSIGHTS_CONNECTION_STRING: ${resource.monitoring.connectionString}
        # The app authenticates with its managed identity, so only addresses are
        # injected for the data - never a key or connection string.
        COSMOS_ENDPOINT: ${resource.database.endpoint}
        COSMOS_DATABASE: ${resource.database.database}
        COSMOS_CONTAINER: ${resource.database.container}
      ports:
        - port: 8080
          protocol: TCP

    # Declared by type only. The platform's component decides that "database" means a container in the
    # environment's Cosmos DB database, and provisions the identity and role assignment that
    # let this workload reach that container; "monitoring" is Application Insights reporting to
    # the environment's workspace, which the enforce-monitoring policy requires of every workload.
    requires:
      - type: database
      - type: monitoring
- definitionSha256: aa72900291c3faa72a186ba691ced3db9365a8209624ad6c782ecefa34c9a6a2
  dependsOn: []
  definition: |
    apiVersion: just-deliver/v1
    kind: Workload

    metadata:
      name: just-deliver-sample-worker
      team: platform-team

    # A second workload for the sample release: it reuses the sample app's pinned image (the
    # image S14 published) under its own name and gets its own database container.
    container:
      image: ghcr.io/sleepyshark85/just-deliver-sample-app@sha256:267b1385d6102da0d5693506e740d509a40b654e6daa2a99c1169938d182cab9
      variables:
        LOG_LEVEL: info
        APPLICATIONINSIGHTS_CONNECTION_STRING: ${resource.monitoring.connectionString}
        COSMOS_ENDPOINT: ${resource.database.endpoint}
        COSMOS_DATABASE: ${resource.database.database}
        COSMOS_CONTAINER: ${resource.database.container}
      ports:
        - port: 8080
          protocol: TCP

    requires:
      - type: database
      - type: monitoring
