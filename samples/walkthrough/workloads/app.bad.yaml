# The bad release's app: its container variable names a container that does not exist (as the Azure test does).
apiVersion: just-deliver/v1
kind: Workload

metadata:
  name: just-deliver-sample-app
  team: platform-team

container:
  image: ghcr.io/sleepyshark85/just-deliver-sample-app@sha256:267b1385d6102da0d5693506e740d509a40b654e6daa2a99c1169938d182cab9
  variables:
    LOG_LEVEL: info
    APP_VERSION: "1"   # the "version": a changed value is a new revision of the same image
    COSMOS_ENDPOINT: ${resource.database.endpoint}
    COSMOS_DATABASE: ${resource.database.database}
    COSMOS_CONTAINER: no-such-container   # bad: /health answers 503, so the probe fails
  ports:
    - port: 8080
      protocol: TCP

requires:
  - type: database
