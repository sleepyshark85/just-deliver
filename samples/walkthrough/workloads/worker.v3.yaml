# The worker of release v3, the recovery of scenario 6: only APP_VERSION differs from v2.
apiVersion: just-deliver/v1
kind: Workload

metadata:
  name: just-deliver-sample-worker
  team: platform-team

container:
  image: ghcr.io/sleepyshark85/just-deliver-sample-app@sha256:267b1385d6102da0d5693506e740d509a40b654e6daa2a99c1169938d182cab9
  variables:
    LOG_LEVEL: info
    APPLICATIONINSIGHTS_CONNECTION_STRING: ${resource.monitoring.connectionString}
    APP_VERSION: "3"   # the "version": a changed value is a new revision of the same image
    COSMOS_ENDPOINT: ${resource.database.endpoint}
    COSMOS_DATABASE: ${resource.database.database}
    COSMOS_CONTAINER: ${resource.database.container}
  ports:
    - port: 8080
      protocol: TCP

requires:
  - type: database
  - type: monitoring
