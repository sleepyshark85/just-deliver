config:
  # App Service Plan
  app-service:skuName: F1
  app-service:skuTier: Free
  app-service:skuSize: F1
  app-service:skuFamily: F
  app-service:skuCapacity: 1
  app-service:planKind: App
  app-service:reserved: false

  # Web App - name must be globally unique across Azure
  app-service:webAppKind: app
  app-service:httpsOnly: true
  app-service:alwaysOn: false
  app-service:http20Enabled: true
  app-service:minTlsVersion: "1.2"
  app-service:ftpsState: Disabled
  app-service:netFrameworkVersion: v4.0
  app-service:use32BitWorkerProcess: true
