name: app-service
runtime: yaml
description: Provisions an Azure App Service Plan and Web App

configuration:
  # --- Placement ---
  resourceGroupName:
    type: String
    description: Resource group the plan and web app are created in (from the resource-group stack's output)

  location:
    type: String
    default: southeastasia
    description: Azure region for the plan and web app

  # --- App Service Plan ---
  planName:
    type: String
    description: Name of the App Service Plan

  planKind:
    type: String
    default: App
    description: Plan kind (e.g. App for Windows, Linux for Linux)

  skuName:
    type: String
    default: F1
    description: SKU name (e.g. F1, B1, S1, P1v2)

  skuTier:
    type: String
    default: Free
    description: SKU tier (Free, Basic, Standard, PremiumV2, ...)

  skuSize:
    type: String
    default: F1
    description: SKU size code

  skuFamily:
    type: String
    default: F
    description: SKU family code

  skuCapacity:
    type: Integer
    default: 1
    description: Number of workers/instances

  reserved:
    type: Boolean
    default: false
    description: true for Linux plans, false for Windows plans

  perSiteScaling:
    type: Boolean
    default: false
    description: Allow each app on the plan to scale independently

  zoneRedundant:
    type: Boolean
    default: false
    description: Spread plan instances across availability zones (requires a Premium+ SKU)

  isSpot:
    type: Boolean
    default: false
    description: Use discounted spot capacity for the plan

  # --- Web App: identity & access ---
  appName:
    type: String
    description: Name of the Web App (must be globally unique across Azure)

  webAppKind:
    type: String
    default: app
    description: Web app kind (app, app,linux, app,container,linux, ...)

  httpsOnly:
    type: Boolean
    default: true
    description: Redirect all HTTP traffic to HTTPS

  clientAffinityEnabled:
    type: Boolean
    default: false
    description: Route a client's requests to the same instance (sticky sessions)

  clientCertEnabled:
    type: Boolean
    default: false
    description: Require client certificates for incoming requests

  clientCertMode:
    type: String
    default: Required
    description: How client certificates are enforced (Required, Optional, OptionalInteractiveUser)

  enabled:
    type: Boolean
    default: true
    description: Whether the app accepts requests

  publicNetworkAccess:
    type: String
    default: Enabled
    description: Enabled or Disabled - controls public network access to the app

  # --- Web App: site config ---
  alwaysOn:
    type: Boolean
    default: false
    description: Keep the app loaded at all times (not available on Free/Shared tiers)

  http20Enabled:
    type: Boolean
    default: true
    description: Enable HTTP/2

  ftpsState:
    type: String
    default: Disabled
    description: FTP/FTPS access (AllAllowed, FtpsOnly, Disabled)

  netFrameworkVersion:
    type: String
    default: v4.0
    description: .NET Framework version for Windows apps (e.g. v4.0, v6.0, v8.0)

  webSocketsEnabled:
    type: Boolean
    default: false
    description: Enable WebSockets

  numberOfWorkers:
    type: Integer
    default: 1
    description: Number of workers for the app

  use32BitWorkerProcess:
    type: Boolean
    default: true
    description: Use a 32-bit worker process (required on Free/Shared tiers)

  healthCheckPath:
    type: String
    default: ""
    description: Path used for health check pings (e.g. /health)

  requestTracingEnabled:
    type: Boolean
    default: false
    description: Enable failed request tracing

  remoteDebuggingEnabled:
    type: Boolean
    default: false
    description: Enable remote debugging (requires Basic tier or above)

  autoHealEnabled:
    type: Boolean
    default: false
    description: Enable Auto Heal rules

  loadBalancing:
    type: String
    default: LeastRequests
    description: Load balancing strategy across instances

  managedPipelineMode:
    type: String
    default: Integrated
    description: Managed pipeline mode (Integrated or Classic)

  scmType:
    type: String
    default: None
    description: Source control/deployment method (None, LocalGit, GitHub, VSTSRM, ...)

  detailedErrorLoggingEnabled:
    type: Boolean
    default: false
    description: Enable detailed error message logging

  httpLoggingEnabled:
    type: Boolean
    default: false
    description: Enable HTTP request logging

  corsAllowedOrigins:
    type: List<String>
    default: ["*"]
    description: Allowed CORS origins

  corsSupportCredentials:
    type: Boolean
    default: false
    description: Allow credentials (cookies, auth headers) on CORS requests

resources:
  appServicePlan:
    type: azure-native:web:AppServicePlan
    properties:
      name: ${planName}
      resourceGroupName: ${resourceGroupName}
      location: ${location}
      kind: ${planKind}
      reserved: ${reserved}
      perSiteScaling: ${perSiteScaling}
      zoneRedundant: ${zoneRedundant}
      isSpot: ${isSpot}
      sku:
        name: ${skuName}
        tier: ${skuTier}
        size: ${skuSize}
        family: ${skuFamily}
        capacity: ${skuCapacity}

  webApp:
    type: azure-native:web:WebApp
    properties:
      name: ${appName}
      resourceGroupName: ${resourceGroupName}
      location: ${location}
      serverFarmId: ${appServicePlan.id}
      kind: ${webAppKind}
      httpsOnly: ${httpsOnly}
      clientAffinityEnabled: ${clientAffinityEnabled}
      clientCertEnabled: ${clientCertEnabled}
      clientCertMode: ${clientCertMode}
      enabled: ${enabled}
      publicNetworkAccess: ${publicNetworkAccess}
      siteConfig:
        alwaysOn: ${alwaysOn}
        http20Enabled: ${http20Enabled}
        # Hardcoded (not sourced from config): numeric-looking config strings like "1.2"
        # get coerced to a number by the YAML runtime's ${} substitution, which Azure rejects.
        minTlsVersion: "1.2"
        ftpsState: ${ftpsState}
        netFrameworkVersion: ${netFrameworkVersion}
        webSocketsEnabled: ${webSocketsEnabled}
        numberOfWorkers: ${numberOfWorkers}
        use32BitWorkerProcess: ${use32BitWorkerProcess}
        healthCheckPath: ${healthCheckPath}
        requestTracingEnabled: ${requestTracingEnabled}
        remoteDebuggingEnabled: ${remoteDebuggingEnabled}
        autoHealEnabled: ${autoHealEnabled}
        loadBalancing: ${loadBalancing}
        managedPipelineMode: ${managedPipelineMode}
        scmType: ${scmType}
        detailedErrorLoggingEnabled: ${detailedErrorLoggingEnabled}
        httpLoggingEnabled: ${httpLoggingEnabled}
        cors:
          allowedOrigins: ${corsAllowedOrigins}
          supportCredentials: ${corsSupportCredentials}

outputs:
  appServicePlanId: ${appServicePlan.id}
  appServicePlanName: ${appServicePlan.name}
  webAppId: ${webApp.id}
  webAppName: ${webApp.name}
  webAppDefaultHostName: ${webApp.defaultHostName}
