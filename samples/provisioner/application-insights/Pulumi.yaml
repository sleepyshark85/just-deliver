name: application-insights
runtime: yaml
description: Provisions a workspace-based Azure Application Insights component

configuration:
  resourceGroupName:
    type: String
    description: Resource group the component is created in

  location:
    type: String
    default: southeastasia
    description: Azure region the component is created in

  appInsightsName:
    type: String
    description: Name of the Application Insights component

  # Workspace-based Application Insights (the only mode for new resources) has no
  # tier/SKU knob - it bills consumption-based, with the first 5GB/month free.
  workspaceResourceId:
    type: String
    description: Resource ID of the Log Analytics Workspace to associate with (from the azure-monitor stack's output)

  applicationType:
    type: String
    default: web
    description: Application type (web, other)

  # Optional: rejects instrumentation-key/API-key ingestion, requiring an Entra ID
  # token instead (callers need the Monitoring Metrics Publisher role). Off by
  # default - the browser/JavaScript SDK can't authenticate this way, so enabling
  # it silently drops any client-side telemetry.
  disableLocalAuth:
    type: Boolean
    default: false
    description: Require Entra ID authentication for telemetry ingestion

resources:
  component:
    type: azure-native:applicationinsights:Component
    properties:
      resourceGroupName: ${resourceGroupName}
      location: ${location}
      kind: web
      applicationType: ${applicationType}
      workspaceResourceId: ${workspaceResourceId}
      disableLocalAuth: ${disableLocalAuth}

outputs:
  appInsightsId: ${component.id}
  appInsightsName: ${component.name}
  instrumentationKey: ${component.instrumentationKey}
  connectionString: ${component.connectionString}
