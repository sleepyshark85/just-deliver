name: azure-monitor
runtime: yaml
description: Provisions an Azure Monitor Log Analytics Workspace

configuration:
  resourceGroupName:
    type: String
    description: Resource group the workspace is created in

  location:
    type: String
    default: southeastasia
    description: Azure region the workspace is created in

  workspaceName:
    type: String
    description: Name of the Log Analytics Workspace

  # The legacy Free/Standard/Premium SKUs can no longer be provisioned - PerGB2018
  # is the only creatable SKU now. It's still $0 in practice: every subscription
  # gets 5GB/month free ingestion (shared across PerGB2018 workspaces) plus 31
  # days of free retention.
  skuName:
    type: String
    default: PerGB2018
    description: Workspace SKU (PerGB2018 is the only provisionable SKU; legacy Free/Standard/Premium are retired)

  retentionInDays:
    type: Integer
    default: 31
    description: Data retention in days (31 days is included at no extra cost)

resources:
  workspace:
    type: azure-native:operationalinsights:Workspace
    properties:
      resourceGroupName: ${resourceGroupName}
      location: ${location}
      workspaceName: ${workspaceName}
      sku:
        name: ${skuName}
      retentionInDays: ${retentionInDays}

outputs:
  workspaceId: ${workspace.id}
  workspaceName: ${workspace.name}
  workspaceCustomerId: ${workspace.customerId}
