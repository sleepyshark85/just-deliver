name: cosmos-db
runtime: yaml
description: Provisions an Azure Cosmos DB (SQL API) account, database, and container

configuration:
  resourceGroupName:
    type: String
    description: Resource group the account is created in

  location:
    type: String
    default: southeastasia
    description: Azure region the account is created in

  accountName:
    type: String
    description: Name of the Cosmos DB account (must be globally unique)

  databaseName:
    type: String
    default: appdb
    description: Name of the SQL API database

  containerName:
    type: String
    default: items
    description: Name of the container within the database

  partitionKeyPath:
    type: String
    default: /id
    description: Partition key path for the container

  # The free tier (1000 RU/s + 25GB storage, no time limit) is limited to one
  # account per subscription - this is what makes Cosmos DB actually $0.
  enableFreeTier:
    type: Boolean
    default: true
    description: Enable the Cosmos DB free tier (one per subscription)

resources:
  account:
    type: azure-native:cosmosdb:DatabaseAccount
    properties:
      resourceGroupName: ${resourceGroupName}
      location: ${location}
      accountName: ${accountName}
      kind: GlobalDocumentDB
      databaseAccountOfferType: Standard
      enableFreeTier: ${enableFreeTier}
      consistencyPolicy:
        defaultConsistencyLevel: Session
      locations:
        - locationName: ${location}
          failoverPriority: 0

  database:
    type: azure-native:cosmosdb:SqlResourceSqlDatabase
    properties:
      resourceGroupName: ${resourceGroupName}
      accountName: ${account.name}
      databaseName: ${databaseName}
      resource:
        id: ${databaseName}

  container:
    type: azure-native:cosmosdb:SqlResourceSqlContainer
    properties:
      resourceGroupName: ${resourceGroupName}
      accountName: ${account.name}
      databaseName: ${database.name}
      containerName: ${containerName}
      resource:
        id: ${containerName}
        partitionKey:
          paths:
            - ${partitionKeyPath}
          kind: Hash

outputs:
  accountId: ${account.id}
  accountName: ${account.name}
  documentEndpoint: ${account.documentEndpoint}
  databaseName: ${database.name}
  containerName: ${container.name}
