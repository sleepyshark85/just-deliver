apiVersion: just-deliver/v1
kind: Workload

metadata:
  name: just-deliver-sample-app
  team: platform-team
  environment: dev

# Everything the workload needs, including its own runtime. Each entry is named, so a second
# database or a second runtime is just another entry, and so references have something to
# key on.
resources:
  - name: api
    type: computing
    image: myregistry.azurecr.io/just-deliver-sample-app:1.0.0
    class: standard
    variables:
      LOG_LEVEL: info
      # Only the endpoint is needed - the app authenticates with its managed identity, so no
      # key or connection string is handed over.
      COSMOS_ENDPOINT: ${resource.primary.endpoint}
    ports:
      - port: 8080
        protocol: TCP

  - name: primary
    type: database
    class: standard

# Deliberately absent: observability. Log Analytics and Application Insights are attached to
# every workload by policy, not requested by the team.
