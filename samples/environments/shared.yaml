# Once per subscription: the shared resources what it offers reaches through `uses` - the resource group, the Log Analytics workspace
# (capped) and the one free-tier Cosmos DB account. Its descriptor offers nothing; it is the --base of every environment.
#   jd env up samples/environments/shared.yaml --catalog catalog --out shared.env.yaml
kind: EnvironmentDefinition
name: shared
region: southeastasia
type: shared
offers: [container-app, database, monitoring]
