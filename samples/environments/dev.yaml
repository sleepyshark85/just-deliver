# The dev environment on top of the shared layer: the environment resources what it offers reaches (its resource group, its Container Apps
# environment and its Cosmos DB database); its descriptor is the base's values plus their exports.
#   jd env up samples/environments/dev.yaml --catalog catalog --base shared.env.yaml --out dev.env.yaml
kind: EnvironmentDefinition
name: dev
region: southeastasia
type: dev
offers: [container-app, database, monitoring]
