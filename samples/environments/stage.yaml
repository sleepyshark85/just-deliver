# The stage environment on top of the shared layer: what dev offers, plus an approval policy, which gates it (a set reaches stage only through `jd promote`).
#   jd env up samples/environments/stage.yaml --catalog catalog --base shared.env.yaml --out stage.env.yaml
# Strict as shipped: the approver below is the all-zero id, which matches no principal, so nobody can approve until you list the object ids of the
# service principals that may; and a principal that deployed a label on dev may not approve it.
kind: EnvironmentDefinition
name: stage
region: southeastasia
type: stage
offers: [container-app, database, monitoring]
approval:
  qualifiedOn: dev                # the environment whose records must show the set qualified
  required: 1                     # distinct approvers needed
  approvers: ["00000000-0000-0000-0000-000000000000"]   # Entra object ids that may approve
  separateFromDeployer: true      # an approver may not be a principal that deployed the label on dev
