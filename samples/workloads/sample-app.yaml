apiVersion: just-deliver/v1
kind: Workload

metadata:
  name: just-deliver-sample-app
  team: platform-team

container:
  image: myregistry.azurecr.io/just-deliver-sample-app:1.0.0
  variables:
    LOG_LEVEL: info
    # The app authenticates with its managed identity, so only addresses are
    # injected here - never a key or connection string. The App Insights
    # connection string is not listed either: enforce-monitoring attaches it.
    COSMOS_ENDPOINT: ${resource.cosmos-sql.endpoint}
    COSMOS_DATABASE: ${resource.cosmos-sql.database}
    COSMOS_CONTAINER: ${resource.cosmos-sql.container}
  ports:
    - port: 8080
      protocol: TCP

# Declared by type only. The platform decides that "cosmos-sql" means a container in the
# environment's Cosmos DB database, and provisions the identity and role assignment that
# let this workload reach that container.
#
# Deliberately absent: monitoring. Log Analytics and Application Insights are
# attached by the enforce-monitoring global policy, not requested by the team.
requires:
  - type: cosmos-sql
