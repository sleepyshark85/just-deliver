<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wdf-steps-title wdf-steps-desc">
    <title id="wdf-steps-title">Orchestrator step loop</title>
    <desc id="wdf-steps-desc">The orchestrator provisions infra, creates a dark revision and grants, runs the preDeploy migration and a retrying verify hook, shifts traffic, then runs postDeploy; failures before the traffic shift leave infra in place and traffic unchanged, and a postDeploy failure marks the deployment degraded.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="d2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <g fill="none" stroke="#4f5d75" stroke-width="1.2">
      <line x1="172" y1="156" x2="194" y2="156" marker-end="url(#d2-arrow)"/>
      <line x1="332" y1="156" x2="354" y2="156" marker-end="url(#d2-arrow)"/>
      <line x1="492" y1="156" x2="514" y2="156" marker-end="url(#d2-arrow)"/>
      <line x1="652" y1="156" x2="674" y2="156" marker-end="url(#d2-arrow)"/>
      <line x1="812" y1="156" x2="834" y2="156" marker-end="url(#d2-arrow)"/>
      <path d="M 564,120 V 104 Q 564,96 572,96 H 596 Q 604,96 604,104 V 118" stroke-width="1" marker-end="url(#d2-arrow)"/>
      <line x1="936" y1="192" x2="936" y2="278" marker-end="url(#d2-arrow)"/>
      <path d="M 872,192 V 232 Q 872,240 864,240 H 752 Q 744,240 744,248 V 278" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d2-arrow)"/>
      <g stroke-dasharray="4,3" stroke-width="1">
        <line x1="104" y1="192" x2="104" y2="278" marker-end="url(#d2-arrow)"/>
        <line x1="264" y1="192" x2="264" y2="278" marker-end="url(#d2-arrow)"/>
        <line x1="424" y1="192" x2="424" y2="278" marker-end="url(#d2-arrow)"/>
        <line x1="584" y1="192" x2="584" y2="278" marker-end="url(#d2-arrow)"/>
      </g>
    </g>

    <g font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" letter-spacing="0.06em">
      <rect x="538" y="74" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="83" text-anchor="middle">RETRY TO TIMEOUT</text>
      <rect x="110" y="230" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="114" y="239">ON FAILURE</text>
      <rect x="942" y="230" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="946" y="239">PASS</text>
      <rect x="788" y="222" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="804" y="231" text-anchor="middle">FAIL</text>
    </g>

    <g font-family="'Geist', sans-serif">
      <rect x="36" y="120" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="44" y="135" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" letter-spacing="0.08em">01</text>
      <text x="104" y="160" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Provision infra</text>
      <text x="104" y="176" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">workload-tier stacks</text>
      <rect x="196" y="120" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="204" y="135" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" letter-spacing="0.08em">02</text>
      <text x="264" y="160" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Revision + grants</text>
      <text x="264" y="176" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">dark · identities</text>
      <rect x="356" y="120" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="364" y="135" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" letter-spacing="0.08em">03</text>
      <text x="424" y="160" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">preDeploy hook</text>
      <text x="424" y="176" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">migration · no retry</text>
      <rect x="516" y="120" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="524" y="135" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" letter-spacing="0.08em">04</text>
      <text x="584" y="160" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">verify hook</text>
      <text x="584" y="176" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">dark FQDN · smoke</text>
      <rect x="676" y="120" width="136" height="72" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/>
      <text x="684" y="135" font-family="'Geist Mono', monospace" font-size="7" fill="#eb6c36" letter-spacing="0.08em">05</text>
      <text x="744" y="160" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Shift traffic</text>
      <text x="744" y="176" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">revision weights</text>
      <rect x="836" y="120" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="844" y="135" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" letter-spacing="0.08em">06</text>
      <text x="904" y="160" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">postDeploy hook</text>
      <text x="904" y="176" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">live FQDN · tests</text>

      <rect x="36" y="280" width="616" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
      <text x="344" y="304" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Failed — partially applied</text>
      <text x="344" y="321" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">infra kept (forward-only) · traffic unchanged · retry resumes at the failed step</text>

      <rect x="676" y="280" width="136" height="40" rx="20" fill="#ffffff" stroke="#2d3142"/>
      <text x="744" y="297" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Degraded</text>
      <text x="744" y="311" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">traffic stays</text>

      <rect x="836" y="280" width="136" height="40" rx="20" fill="#ffffff" stroke="#2d3142"/>
      <text x="904" y="297" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Live</text>
      <text x="904" y="311" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">release recorded</text>
    </g>

    <g font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#4f5d75">
      <text x="36" y="376">Nothing user-visible happens before step 05: infra, grants, migration and smoke tests must all pass first.</text>
    </g>

    <line x1="20" y1="412" x2="980" y2="412" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
    <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
      <text x="20" y="436" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="426" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142"/>
      <text x="128" y="436">STEP (ONE QUEUE ROUND TRIP)</text>
      <rect x="300" y="426" width="20" height="14" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/>
      <text x="328" y="436">POINT OF EXPOSURE</text>
      <line x1="450" y1="433" x2="480" y2="433" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="488" y="436">SUCCESS</text>
      <line x1="560" y1="433" x2="590" y2="433" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="598" y="436">FAILURE / RETRY</text>
      <rect x="700" y="426" width="20" height="14" rx="7" fill="#ffffff" stroke="#2d3142"/>
      <text x="728" y="436">END STATE</text>
    </g>
  </svg>
