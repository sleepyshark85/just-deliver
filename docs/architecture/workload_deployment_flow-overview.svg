<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wdf-overview-title wdf-overview-desc">
    <title id="wdf-overview-title">Workload deployment flow — overview</title>
    <desc id="wdf-overview-desc">A validated workload definition is resolved against versioned mappings, policies and environment data into a resolved graph, which passes a preview and approval gate before a durable orchestrator executes it through a job queue and the Pulumi backend provider.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <g fill="none" stroke="#4f5d75" stroke-width="1.2">
      <line x1="160" y1="236" x2="198" y2="236" marker-end="url(#d1-arrow)"/>
      <line x1="280" y1="136" x2="280" y2="198" marker-end="url(#d1-arrow)"/>
      <line x1="360" y1="236" x2="398" y2="236" marker-end="url(#d1-arrow)"/>
      <line x1="560" y1="236" x2="598" y2="236" marker-end="url(#d1-arrow)"/>
      <line x1="720" y1="236" x2="778" y2="236" marker-end="url(#d1-arrow)"/>
      <line x1="660" y1="280" x2="660" y2="330" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#d1-arrow)"/>
      <line x1="850" y1="272" x2="850" y2="438" marker-end="url(#d1-arrow)"/>
      <line x1="910" y1="440" x2="910" y2="274" marker-end="url(#d1-arrow)"/>
      <line x1="800" y1="460" x2="722" y2="460" marker-end="url(#d1-arrow)"/>
      <line x1="720" y1="484" x2="798" y2="484" marker-end="url(#d1-arrow)"/>
      <line x1="480" y1="272" x2="480" y2="292" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>

    <g font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" letter-spacing="0.06em">
      <rect x="288" y="162" width="78" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="171">MATCH · MERGE</text>
      <rect x="722" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="750" y="223" text-anchor="middle">APPROVED</text>
      <rect x="668" y="298" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="672" y="307">REJECTED</text>
      <rect x="794" y="350" width="50" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="359" text-anchor="end">STEP JOB</text>
      <rect x="916" y="350" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="920" y="359">NOTIFY</text>
      <rect x="736" y="438" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="447" text-anchor="middle">CONSUME</text>
      <rect x="736" y="492" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="501" text-anchor="middle">OUTPUTS</text>
    </g>

    <rect x="20" y="200" width="140" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="20" y="200" width="140" height="72" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
    <rect x="28" y="206" width="24" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.5" stroke-width="0.8"/>
    <text x="40" y="215" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle" letter-spacing="0.08em">IN</text>
    <text x="90" y="240" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">workload.yaml</text>
    <text x="90" y="256" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">validated · SHA kept</text>

    <rect x="180" y="64" width="200" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="180" y="64" width="200" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
    <rect x="188" y="70" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="204" y="79" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75" text-anchor="middle" letter-spacing="0.08em">DATA</text>
    <text x="280" y="104" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Mappings · Policies</text>
    <text x="280" y="120" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">+ environment · versioned</text>

    <rect x="200" y="200" width="160" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="200" y="200" width="160" height="72" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/>
    <rect x="208" y="206" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="0.8"/>
    <text x="224" y="215" font-family="'Geist Mono', monospace" font-size="7" fill="#eb6c36" text-anchor="middle" letter-spacing="0.08em">CORE</text>
    <text x="280" y="240" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Resolver</text>
    <text x="280" y="256" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">pure fn · no Pulumi</text>

    <rect x="400" y="200" width="160" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="400" y="200" width="160" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
    <rect x="408" y="206" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="422" y="215" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text x="480" y="240" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Resolved graph</text>
    <text x="480" y="256" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">nodes · edges · provenance</text>

    <polygon points="660,192 720,236 660,280 600,236" fill="#f5f5f5"/>
    <polygon points="660,192 720,236 660,280 600,236" fill="#ffffff" stroke="#2d3142"/>
    <text x="660" y="233" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">Preview &amp;</text>
    <text x="660" y="247" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">approve?</text>

    <rect x="600" y="332" width="120" height="36" rx="18" fill="#f5f5f5"/>
    <rect x="600" y="332" width="120" height="36" rx="18" fill="#ffffff" stroke="#2d3142"/>
    <text x="660" y="354" font-family="'Geist', sans-serif" font-size="11" font-weight="500" fill="#2d3142" text-anchor="middle">Stopped · no change</text>

    <rect x="780" y="200" width="200" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="780" y="200" width="200" height="72" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/>
    <rect x="788" y="206" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="0.8"/>
    <text x="804" y="215" font-family="'Geist Mono', monospace" font-size="7" fill="#eb6c36" text-anchor="middle" letter-spacing="0.08em">CORE</text>
    <text x="880" y="240" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Orchestrator</text>
    <text x="880" y="256" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">durable step loop</text>

    <rect x="800" y="440" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="800" y="440" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
    <text x="880" y="470" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Job queue</text>
    <text x="880" y="486" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">session = workload+env</text>

    <rect x="520" y="440" width="200" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="520" y="440" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="620" y="470" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Backend provider</text>
    <text x="620" y="486" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">Pulumi · YAML templates</text>

    <g font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#4f5d75">
      <text x="400" y="308">Open references (e.g. the DB</text>
      <text x="400" y="326">endpoint) are filled by the</text>
      <text x="400" y="344">orchestrator from earlier</text>
      <text x="400" y="362">steps' outputs.</text>
      <text x="500" y="477" text-anchor="end">Only the provider knows Pulumi —</text>
      <text x="500" y="495" text-anchor="end">everything upstream is backend-agnostic.</text>
    </g>

    <line x1="20" y1="552" x2="980" y2="552" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
    <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
      <text x="20" y="576" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="566" width="20" height="14" rx="3" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
      <text x="128" y="576">INPUT</text>
      <rect x="200" y="566" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142"/>
      <text x="228" y="576">STEP / SERVICE</text>
      <rect x="340" y="566" width="20" height="14" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
      <text x="368" y="576">DATA / ARTIFACT</text>
      <rect x="490" y="566" width="20" height="14" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/>
      <text x="518" y="576">CORE PLATFORM LOGIC</text>
      <polygon points="660,566 670,573 660,580 650,573" fill="#ffffff" stroke="#2d3142"/>
      <text x="680" y="576">GATE</text>
      <line x1="740" y1="573" x2="770" y2="573" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="778" y="576">EXIT WITHOUT CHANGE</text>
    </g>
  </svg>
